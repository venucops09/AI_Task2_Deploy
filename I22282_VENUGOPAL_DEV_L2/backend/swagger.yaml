openapi: 3.0.3
info:
  title: CRM Backend API
  version: 1.0.0
  description: REST API documentation for the CRM backend (customers, leads, tasks, interactions, authentication)
servers:
  - url: http://localhost:3001/api
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    User:
      type: object
      properties:
        id: { type: integer }
        username: { type: string }
        email: { type: string }
        full_name: { type: string }
        role: { type: string }
    Customer:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        email: { type: string }
        phone: { type: string }
        address: { type: string }
        company: { type: string }
        created_by: { type: integer }
    Lead:
      type: object
      properties:
        id: { type: integer }
        customer_id: { type: integer }
        status: { type: string }
        source: { type: string }
        assigned_to: { type: integer }
    Task:
      type: object
      properties:
        id: { type: integer }
        title: { type: string }
        description: { type: string }
        due_date: { type: string, format: date }
        status: { type: string }
        assigned_to: { type: integer }
        customer_id: { type: integer }
    Interaction:
      type: object
      properties:
        id: { type: integer }
        customer_id: { type: integer }
        user_id: { type: integer }
        type: { type: string }
        notes: { type: string }
        interaction_time: { type: string, format: date-time }
security:
  - bearerAuth: []
paths:
  /auth/register:
    post:
      tags: [Auth]
      summary: Register a new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, email, password]
              properties:
                username: { type: string }
                email: { type: string, format: email }
                password: { type: string, format: password }
                full_name: { type: string }
                role: { type: string }
      responses:
        '200':
          description: User registered
          content:
            application/json:
              schema:
                type: object
                properties:
                  token: { type: string }
                  user:
                    $ref: '#/components/schemas/User'
        '400': { description: Invalid input }
  /auth/login:
    post:
      tags: [Auth]
      summary: Login and get JWT token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string, format: password }
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  token: { type: string }
                  user:
                    $ref: '#/components/schemas/User'
        '400': { description: Invalid credentials }
  /customers:
    get:
      tags: [Customers]
      summary: List all customers
      security:
        - bearerAuth: []
      responses:
        '200':
          description: List of customers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Customer'
    post:
      tags: [Customers]
      summary: Create a new customer
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Customer'
      responses:
        '200':
          description: Customer created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Customer'
        '400': { description: Invalid input }
  /customers/{id}:
    get:
      tags: [Customers]
      summary: Get a customer by ID
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          schema: { type: integer }
          required: true
      responses:
        '200':
          description: Customer found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Customer'
        '404': { description: Not found }
    put:
      tags: [Customers]
      summary: Update a customer
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          schema: { type: integer }
          required: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Customer'
      responses:
        '200':
          description: Customer updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Customer'
        '400': { description: Invalid input }
        '404': { description: Not found }
    delete:
      tags: [Customers]
      summary: Delete a customer
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          schema: { type: integer }
          required: true
      responses:
        '200': { description: Customer deleted }
        '404': { description: Not found }
  /leads:
